services:
  db:
    image: postgres:15
    container_name: employee-odoo17-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - employee-odoo17-db-data:/var/lib/postgresql/data

  odoo:
    image: odoo:17
    container_name: employee-odoo17
    depends_on:
      - db
    ports:
      - "8071:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - employee-odoo17-data:/var/lib/odoo
      - ../../:/mnt/extra-addons
    command: odoo --dev=all

volumes:
  employee-odoo17-db-data:
  employee-odoo17-data:
